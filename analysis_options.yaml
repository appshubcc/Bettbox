include: package:flutter_lints/flutter.yaml
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - lib/l10n/**
    - lib/clash/generated/**
    - lib/**/generated/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "plugins/**"
    - build/**
    - dist/**
    - android/**
    - windows/**
    - macos/**
    - linux/**
    - ios/**

linter:
  rules:
    prefer_single_quotes: true
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    avoid_dynamic_calls: true
