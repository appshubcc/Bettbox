[package]
name = "code_forge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
fancy-regex = { version = "0.14", default-features = false, features = ["std"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "nfa-backtrack", "hybrid", "perf-literal", "unicode-case", "unicode-perl", "unicode-word-boundary"] }
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
rquickjs = { version = "0.12", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.12", default-features = false, features = ["bindgen"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
