name: bett_box
description: A multi-platform proxy client based on Mihomo, simple and easy to use, open-source and ad-free.
publish_to: 'none'
version: 1.19.7+2026101601
environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  path_provider: ^2.1.6
  path: ^1.9.0
  shared_preferences: ^2.5.5
  window_manager: ^0.5.2
  dynamic_color: ^2.1.0
  material_color_utilities: ^0.13.0
  # Material 3 spec 2021/2025 color scheme generation (Android 16 QPR1+).
  libmonet: 2.0.0-dev.19
  vclibs: ^0.1.3
  proxy:
    path: plugins/proxy
  window_ext:
    path: plugins/window_ext
  tray_manager:
    path: plugins/tray_manager
  launch_at_startup:
    path: plugins/launch_at_startup
  json_annotation: ^4.12.0
  file_picker: ^13.0.0
  mobile_scanner: ^7.2.1
  zxing2: ^0.2.4
  image: ^4.3.0
  app_links: ^7.2.2
  win32_registry: ^3.0.0
  collection: ^1.18.0
  animations: ^3.0.0
  package_info_plus: ^10.0.0
  url_launcher: ^6.3.2
  freezed_annotation: ^3.1.0
  image_picker: ^1.2.3
  webdav_client: ^1.2.2
  dio: ^5.10.0
  win32: ^6.0.0
  ffi: ^2.2.0
  re_highlight: ^0.0.3
  archive: ^4.0.7
  lpinyin: ^2.0.3
  emoji_regex: ^0.0.5
  hotkey_manager: ^0.2.3
  uni_platform: ^0.1.3
  device_info_plus: ^13.0.0
  yaml: ^3.1.2
  connectivity_plus: ^7.3.1
  screen_retriever: ^0.2.0
  defer_pointer: ^0.0.2
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  riverpod: ^3.4.3
  flutter_svg: ^2.2.4
  xml: ^6.6.1
  crypto: ^3.0.7
  google_nav_bar: ^5.0.7
  wakelock_plus: ^1.8.0
  flutter_spinkit: ^5.2.2
  synchronized: ^3.4.0
  restart_app: ^1.8.3
  code_forge:
    path: plugins/code_forge
  material_ui: ^1.6.0
  cupertino_ui: ^1.1.2
dependency_overrides:
  flutter_rust_bridge: 2.13.0
  # Fix compile failure: https://github.com/leanflutter/hotkey_manager/pull/66
  hotkey_manager_linux:
    git:
      url: https://github.com/gepbird/hotkey_manager.git
      path: packages/hotkey_manager_linux
      ref: fix-build-failure
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^20.1.1
  json_serializable: ^6.14.1
  build_runner: ^2.16.2
  args: ^2.4.2
  freezed: ^4.0.2
  riverpod_generator: ^4.0.9
  intl_utils: ^2.8.17
  liquid_engine: ^0.2.2

  flutter_rust_bridge: any
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
    - assets/fonts/
    - assets/images/
    - assets/images/avatars/
    - assets/images/platforms/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.Mozilla.ttf
    - family: Icons
      fonts:
        - asset: assets/fonts/Icons.ttf
    - family: HarmonyOS_Sans
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_Regular.ttf
ffigen:
  name: "ClashFFI"
  output: 'lib/clash/generated/clash_ffi.dart'
  headers:
    entry-points:
      - 'libclash/android/arm64-v8a/libmeta.h'
flutter_intl:
  enabled: true
  class_name: AppLocalizations
  arb_dir: arb
  output_dir: lib/l10n