[package]
name = "helper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "helper"
path = "src/main.rs"

[dependencies]
windows-service = { version = "0.7.0", optional = true }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0.93"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.20.2"
sha2 = "0.10.8"
fs2 = "0.4"
hmac = "0.12"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_System_Threading", "Win32_System_Pipes", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects"] }


[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
